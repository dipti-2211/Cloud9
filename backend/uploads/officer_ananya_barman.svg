<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="200" height="200" rx="100" fill="url(#bg)"/>

  <!-- Bust / Shoulders Uniform -->
  <path d="M 35 200 C 35 145, 60 135, 100 135 C 140 135, 165 145, 165 200 Z" fill="url(#uniform)" filter="url(#shadow)"/>
  
  <!-- Collar & Neck -->
  <polygon points="100,145 80,132 120,132" fill="#ffffff" opacity="0.9"/>
  <polygon points="100,158 90,132 110,132" fill="#10b981"/>
  <rect x="90" y="112" width="20" height="24" rx="4" fill="#f3c299"/>

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="34" ry="40" fill="#f3c299" filter="url(#shadow)"/>

  <!-- Hair -->
  <path d="M 66 80 C 66 50, 80 40, 100 40 C 120 40, 134 50, 134 80 C 130 65, 120 54, 100 54 C 80 54, 70 65, 66 80 Z" fill="#1e293b"/>

  <!-- Ears -->
  <circle cx="66" cy="85" r="7" fill="#f3c299"/>
  <circle cx="134" cy="85" r="7" fill="#f3c299"/>

  <!-- Eyes & Eyebrows -->
  <ellipse cx="87" cy="82" rx="3.5" ry="4" fill="#0f172a"/>
  <ellipse cx="113" cy="82" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="88" cy="80.5" r="1" fill="#ffffff"/>
  <circle cx="114" cy="80.5" r="1" fill="#ffffff"/>
  <path d="M 80 74 Q 87 71 94 74" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 106 74 Q 113 71 120 74" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose & Smile -->
  <path d="M 100 83 L 98 92 L 102 92" stroke="#b47854" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 92 101 Q 100 108 108 101" stroke="#8b4513" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Badge / ID Label Bar -->
  <rect x="45" y="172" width="110" height="20" rx="10" fill="#0f172a" opacity="0.85"/>
  <text x="100" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">AB · OFFICER</text>
</svg>